<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Emirates Services — Daily Costing & Stock</title>
<style>
:root{
  --ink:#1b2230; --ink-2:#252e40; --ink-soft:#39455c;
  --paper:#f6f5f1; --card:#ffffff; --line:#e7e3da; --line-2:#efece5;
  --txt:#1b2230; --muted:#6b7384; --muted-2:#9aa1ad;
  --accent:#d9822b; --accent-deep:#b86a1c; --accent-soft:#fdf1e3;
  --good:#2f8f6b; --good-soft:#e7f3ee;
  --warn:#c2410c; --warn-soft:#fbe9e1;
  --blue:#3b6ea5; --blue-soft:#e9f1f9;
  --radius:12px; --radius-sm:8px; --topbar-h:58px;
  --shadow:0 1px 2px rgba(27,34,48,.06),0 8px 24px rgba(27,34,48,.05);
  --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--txt);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px;color:var(--txt)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.side{width:236px;flex-shrink:0;background:var(--ink);color:#cdd4e0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;letter-spacing:-.5px;flex-shrink:0}
.brand .co{font-weight:700;color:#fff;font-size:13.5px;line-height:1.2}
.brand .sub{font-size:11px;color:#7d879b;margin-top:2px;letter-spacing:.3px}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#69728a;padding:14px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:#c2c9d6;font-weight:500;font-size:13.5px;margin-bottom:1px;transition:background .12s,color .12s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(217,130,43,.35)}
.nav a .ic{width:18px;text-align:center;font-size:15px;opacity:.95}
.side .foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#69728a}
.side .foot b{color:#aeb6c6}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,245,241,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.topbar .crumb{font-size:12px;color:var(--muted);margin-top:1px}
.topbar .spacer{flex:1}
.content{padding:22px 26px 60px;max-width:1500px;width:100%}

/* search + controls */
.searchwrap{position:relative;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 6px 0 12px;min-width:230px;box-shadow:var(--shadow)}
.searchwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchwrap .si{color:var(--muted-2);font-size:14px}
.searchwrap input{border:none;outline:none;padding:9px 8px;background:transparent;width:100%}
.mic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:15px;flex-shrink:0;transition:.15s}
.mic:hover{background:var(--accent-soft);color:var(--accent-deep)}
.mic.live{background:var(--warn);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,65,12,.45)}50%{box-shadow:0 0 0 7px rgba(194,65,12,0)}}

select.sel,input.dt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;box-shadow:var(--shadow);font-weight:500;cursor:pointer}
select.sel:focus,input.dt:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;box-shadow:var(--shadow);transition:.13s;color:var(--ink)}
.btn:hover{border-color:var(--muted-2);transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.ghost{box-shadow:none;background:transparent;border-color:var(--line)}
.btn.danger{color:var(--warn);border-color:var(--warn-soft)}
.btn.danger:hover{background:var(--warn-soft)}
.btn.sm{padding:6px 10px;font-size:12px}

.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-size:25px;font-weight:750;margin-top:6px;letter-spacing:-.5px}
.stat .v small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.stat .tag{position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%}

/* table */
.tablecard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.tablescroll{overflow:auto;max-height:calc(100vh - var(--topbar-h) - 132px)}
.tablecard.with-receipt .tablescroll{max-height:calc(100vh - var(--topbar-h) - 196px)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#fbfaf7;text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:2px solid var(--line);white-space:nowrap;z-index:8;box-shadow:0 1px 0 var(--line)}
tbody td{padding:8px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:#fcfbf8}
tbody tr:last-child td{border-bottom:none}
.t-r{text-align:right}
.t-c{text-align:center}
.cat-row td{background:var(--ink);color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;position:sticky;left:0}
.ref{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.desc{font-weight:600}
.brand{font-size:11.5px;color:var(--muted-2)}
.unit-badge{display:inline-block;background:var(--line-2);color:var(--muted);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.03em}
.pack{font-size:11.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap}
.pack .pk-unit{display:inline-block;background:var(--accent-soft);color:var(--accent-deep);font-weight:800;font-size:10px;padding:1px 6px;border-radius:5px;margin-right:5px;letter-spacing:.03em;text-transform:uppercase}
.pack-cell{font-size:11.5px;color:var(--muted);white-space:nowrap}
.cost-cell{font-family:var(--mono);font-weight:600}
.qty-in{width:74px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;text-align:right;font-family:var(--mono);background:#fff;transition:.12s}
.qty-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qty-in.filled{background:var(--accent-soft);border-color:#f0d4ad;font-weight:600}
.recv-in{width:78px}
.recv-in.filled{background:var(--blue-soft);border-color:#bcd5ee}
.amt{font-family:var(--mono);font-weight:700;color:var(--ink)}
.amt.zero{color:var(--muted-2);font-weight:500}
.closing{font-family:var(--mono);font-weight:700}
.closing.neg{color:var(--warn)}
.closing.low{color:var(--accent-deep)}
.closing.ok{color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.pill.neg{background:var(--warn-soft);color:var(--warn)}
.pill.low{background:var(--accent-soft);color:var(--accent-deep)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.rowact{color:var(--muted-2);font-size:14px;padding:3px 6px;border-radius:6px}
.rowact:hover{background:var(--warn-soft);color:var(--warn)}
.editable{cursor:text;border-radius:5px;padding:3px 5px;margin:-3px -5px}
.editable:hover{background:var(--accent-soft);outline:1px dashed #e7c79c}

/* receipt footer */
.receipt{position:sticky;bottom:0;z-index:20;margin-top:0;background:var(--ink);color:#fff;border-radius:0 0 var(--radius) var(--radius);padding:14px 18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(27,34,48,.12)}
.receipt .rt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b94a8;font-weight:700;margin-right:4px}
.receipt .grp{display:flex;flex-direction:column;gap:1px}
.receipt .grp .gn{font-size:10.5px;color:#9aa3b6;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.receipt .grp .gv{font-family:var(--mono);font-weight:700;font-size:15px}
.receipt .sep{width:1px;height:30px;background:rgba(255,255,255,.12)}
.receipt .grand{margin-left:auto;display:flex;align-items:center;gap:12px}
.receipt .grand .gv{font-family:var(--mono);font-weight:800;font-size:22px;color:var(--accent)}
.receipt .grand .gn{font-size:11px;color:#9aa3b6;text-transform:uppercase;letter-spacing:.08em;font-weight:700}

/* empty / misc */
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .em-ic{font-size:34px;margin-bottom:10px;opacity:.4}
.count{font-size:12px;color:var(--muted);font-weight:600}
.section-h{font-size:13px;font-weight:700;color:var(--ink);margin:26px 0 12px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.section-h::before{content:"";width:3px;height:14px;background:var(--accent);border-radius:2px}

/* bar chart */
.chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:130px 1fr 96px;align-items:center;gap:12px}
.bar-row .bl{font-weight:600;font-size:12.5px;color:var(--ink)}
.bar-track{height:26px;background:var(--line-2);border-radius:7px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:7px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar-row .bv{font-family:var(--mono);font-weight:700;text-align:right;font-size:12.5px}

/* dual bar (target vs actual) */
.dbar{display:flex;flex-direction:column;gap:4px}
.dbar .seg{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;gap:8px}
.dbar .seg .sl{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase}
.dbar .track{height:13px;background:var(--line-2);border-radius:5px;overflow:hidden}
.dbar .fill{height:100%;border-radius:5px}
.dbar .sv{font-family:var(--mono);font-size:11.5px;text-align:right;font-weight:700}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-weight:600;font-size:13.5px;box-shadow:0 12px 34px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.25s;z-index:200;display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--good)} .toast.warn{background:var(--warn)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(27,34,48,.45);backdrop-filter:blur(3px);display:none;place-items:center;z-index:150;padding:20px}
.modal-bg.show{display:grid}
.modal{background:var(--card);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);width:100%;max-width:520px;max-height:88vh;overflow:auto}
.modal h3{font-size:17px;font-weight:700;padding:20px 22px 4px}
.modal .msub{padding:0 22px;color:var(--muted);font-size:13px}
.modal .body{padding:18px 22px}
.modal .frow{margin-bottom:14px}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.modal input,.modal select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .actions{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}

/* groups editor */
.grp-list{display:flex;flex-direction:column;gap:8px}
.grp-item{display:flex;gap:8px;align-items:center}
.grp-item input{flex:1}
.grp-item .gtar{width:96px;flex:none}

/* mobile */
.menu-btn{display:none}
@media(max-width:920px){
  .side{position:fixed;left:0;top:0;z-index:100;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 50px rgba(0,0,0,.4)}
  .side.open{transform:translateX(0)}
  .menu-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:18px}
  .content{padding:16px 14px 60px}
  .topbar{padding:12px 14px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none}
  .scrim.show{display:block}
}
.hide{display:none!important}
.nav-badge{margin-left:auto;background:var(--warn);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;padding:0 5px}
.nav a.active .nav-badge{background:#fff;color:var(--accent-deep)}
.qty-in.over{background:var(--warn-soft)!important;border-color:#e8a48c!important;color:var(--warn);font-weight:800}
.amt.over{color:var(--warn)}
.warn-flag{display:inline-block;margin-left:6px;color:var(--warn);font-weight:800;cursor:help}
.lim-in{width:78px}
.lim-in.set{background:var(--accent-soft);border-color:#f0d4ad;font-weight:700}
.per-sel{padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;font-weight:600}
/* consumption log grid */
.logtbl td,.logtbl th{font-variant-numeric:tabular-nums}
.logtbl .stickL{position:sticky;left:0;background:#fff;z-index:6;box-shadow:1px 0 0 var(--line);min-width:200px;max-width:240px}
.logtbl thead .stickL{z-index:9;background:#fbfaf7}
.logtbl .cat-row .stickL{background:var(--ink)}
.logtbl .dcell{text-align:right;color:var(--muted);min-width:42px}
.logtbl .dcell.has{color:var(--ink);font-weight:600}
.logtbl .dcell.over{color:var(--warn);font-weight:800;background:var(--warn-soft)}
.logtbl .tcol{text-align:right;font-weight:700;background:#fbfaf7}
.alert-card{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--warn-soft);background:#fff;border-left:4px solid var(--warn);border-radius:10px;margin-bottom:8px}
.alert-card .ac-over{margin-left:auto;text-align:right}
.alert-card .ac-over b{color:var(--warn);font-family:var(--mono);font-size:16px}
.cc-camp{background:#fcfbf8}
.tag-camp{display:inline-block;background:var(--good-soft);color:var(--good);font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em;vertical-align:1px}
.tag-ct{display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em;vertical-align:1px}
.ro-md{color:var(--blue);font-weight:700}
.md-in.filled{background:var(--good-soft);border-color:#aed8c6}
.tot-row td{background:#f3f1ea;font-weight:700;border-top:2px solid var(--line)}
.grand-row td{background:var(--ink);color:#fff;font-weight:800}
.grand-row .amt{color:var(--accent)}
.cc-row{display:grid;grid-template-columns:1fr 92px 90px 110px auto;gap:8px;align-items:center;margin-bottom:7px}
.cc-row input.ccn{padding:8px 10px}
.cc-row .ccflag{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:600;cursor:pointer;justify-content:center}
.cc-row .basesel{padding:7px;border:1px solid var(--line);border-radius:7px;font-size:12px;font-weight:600;background:#fff}
</style>
<style>.mini{width:100%;border-collapse:collapse;font-size:12.5px}.mini th{background:#1b2230;color:#fff;padding:6px 8px;text-align:right;position:sticky;top:0}.mini th:first-child{text-align:left}.mini td{padding:5px 8px;border-bottom:1px solid #e6e0d5}.mini .L{text-align:left}.mini tfoot .tot td{background:#fdf1e3;font-weight:700}tr.prow-ch{background:rgba(217,130,43,.10)}#pBar button[disabled]{cursor:default}</style>
<style>.logtbl th.dcell.dzero{color:#c0392b;background:#fbe9e7;font-weight:800}</style>
<script src="/patch.js"></script>
<script src="/shared/portal-bar.js"></script>
<script src="/shared/bridge.js"></script>
<script src="/shared/costing-bridge.js"></script>
<script src="/shared/costing-days.js"></script>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">
        <div class="mark">GE</div>
        <div>
          <div class="co">Global Emirates</div>
          <div class="sub">SERVICES CO L.L.C</div>
        </div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="lbl">Operations</div>
      <a data-view="daily" class="active"><span class="ic">📋</span> Daily Entry</a>
      <a data-view="stock"><span class="ic">📦</span> Stock</a>
      <div class="lbl">Catalogue</div>
      <a data-view="items"><span class="ic">🍎</span> Items</a>
      <a data-view="prices"><span class="ic">🏷️</span> Prices</a>
      <div class="lbl">Insight</div>
      <a data-view="log"><span class="ic">📅</span> Consumption Log</a>
      <a data-view="reports"><span class="ic">📊</span> Reports</a>
      <a data-view="costcat"><span class="ic">🧾</span> Cost by Category</a>
      <a data-view="budget"><span class="ic">💰</span> Budget</a>
      <a data-view="alerts"><span class="ic">🔔</span> Alerts <span class="nav-badge hide" id="alertBadge">0</span></a>
      <div class="lbl">System</div>
      <a data-view="settings"><span class="ic">⚙️</span> Settings &amp; Backup</a>
    </nav>
    <div class="foot">
      Saved on this device ·
      <b id="saveStamp">—</b>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div>
        <h1 id="vTitle">Daily Entry</h1>
        <div class="crumb" id="vCrumb">Record consumption &amp; received goods by day</div>
      </div>
      <div class="spacer"></div>
      <div id="topActions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

function monthKeyNow(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function daysInMonth(mk){const [y,m]=mk.split("-").map(Number);return new Date(y,m,0).getDate();}
function monthLabel(mk){const [y,m]=mk.split("-").map(Number);return new Date(y,m-1,1).toLocaleString("en",{month:"long",year:"numeric"});}
function fmtDMY(str){if(!str)return"";const p=String(str).split("-");if(p.length<3)return str;const dt=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(dt)?str:dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}

function freshDB(){
  const items = SEED.items.map((it,i)=>({
    id:"i"+i, ref:it.ref, desc:it.desc, brand:it.brand||"",
    pack:it.pack||it.unit||"", cost:Number(it.cost)||0, cat:it.cat, limit:0, limitPer:"day"
  }));
  const db={
    v:1, items, categories:[...SEED.categories],
    groups:JSON.parse(JSON.stringify(DEFAULT_GROUPS)),
    costCenters:JSON.parse(JSON.stringify(DEFAULT_COST_CENTERS)),
    targets:{...DEFAULT_TARGETS},
    settings:{currency:"AED", lowStock:10},
    months:{}
  };
  // seed opening stock into current month
  const mk = monthKeyNow();
  db.months[mk] = {opening:{},received:{},cons:{},manday:{}};
  SEED.items.forEach((it,i)=>{ if(it.opening) db.months[mk].opening["i"+i]=Number(it.opening); });
  return db;
}
function ensureMonth(mk){
  if(!db.months[mk]) db.months[mk]={opening:{},received:{},cons:{},manday:{}};
  return db.months[mk];
}
function migrate(){
  if(!db) return;
  (db.items||[]).forEach(it=>{
    if(it.limit==null) it.limit=0;
    if(!it.limitPer) it.limitPer="day";
    if(it.pack==null) it.pack=it.unit||"";
  });
  if(!db.settings) db.settings={currency:"AED",lowStock:10};
  if(!db.costCenters||!db.costCenters.length) db.costCenters=JSON.parse(JSON.stringify(DEFAULT_COST_CENTERS));
  db.costCenters.forEach(c=>{if(c.target==null)c.target=0;if(!c.base)c.base="own";if(c.camp==null)c.camp=false;});
  var _mk=Object.keys(db.months||{}).sort();var _base=_mk.length?_mk[0]:monthKeyNow();
  (db.items||[]).forEach(function(it){ if(!it.prices||typeof it.prices!=="object"){ it.prices={}; it.prices[_base]=Number(it.cost)||0; } });
  if(!Array.isArray(db.priceChanges)) db.priceChanges=[];
}
function load(){
  try{const raw=localStorage.getItem(LS_KEY); if(raw){db=JSON.parse(raw); migrate(); return;}}catch(e){}
  db=freshDB(); save();
}
async function loadDesktop(){
  try{ const res=await window.desktopStorage.loadData(); if(res && res.ok && res.data){ db=JSON.parse(res.data); migrate(); return; } }catch(e){}
  db=freshDB(); save();
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{
      const payload=JSON.stringify(db);
      if(DESKTOP){ window.desktopStorage.saveData(payload).then(r=>{ if(r && !r.ok) toast("Could not save: "+(r.error||"file error"),"warn"); }); scheduleAutoBackup(payload); }
      else { localStorage.setItem(LS_KEY,payload); }
      const st=document.getElementById("saveStamp"); if(st) st.textContent=new Date().toLocaleTimeString("en",{hour:"2-digit",minute:"2-digit"});
    }catch(e){toast("Could not save — storage full or blocked","warn");}
  },120);
}

const money=n=>(Number(n)||0).toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2});
const qfmt=n=>{n=Number(n)||0;return Number.isInteger(n)?n.toString():n.toLocaleString("en",{maximumFractionDigits:3});};
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function item(id){return db.items.find(i=>i.id===id);}
function priceFor(it,mk){var p=it&&it.prices;if(!p||typeof p!=="object")return Number(it&&it.cost)||0;var target=(String(mk).length===7)?mk+"-31":mk;var keys=Object.keys(p).sort();if(!keys.length)return Number(it.cost)||0;var val=null;for(var i=0;i<keys.length;i++){if(keys[i]<=target)val=p[keys[i]];}if(val==null)val=p[keys[0]];return Number(val)||0;}
function dayKey(mk,day){return mk+"-"+String(day).padStart(2,"0");}
function monthConsCost(mk,itemId){var m=db.months[mk];if(!m)return 0;var it=item(itemId);if(!it)return 0;var s=0;Object.keys(m.cons||{}).forEach(function(d){var q=dayConsQty(mk,d,itemId);if(q)s+=q*priceFor(it,dayKey(mk,d));});return s;}
function newestMonth(){var k=Object.keys(db.months||{}).sort();return k.length?k[k.length-1]:monthKeyNow();}
function monthConsQty(mk,itemId){var s=0;var m=db.months[mk];if(!m)return 0;Object.keys(m.cons||{}).forEach(function(d){s+=dayConsQty(mk,d,itemId);});return s;}
function normRef(r){return (r==null?"":String(r)).replace(/\D/g,"");}
function packBits(p){p=(p||"").trim();if(!p)return{unit:"",rest:""};const m=p.match(/^([A-Za-z\/]+)\s*(.*)$/);if(m)return{unit:m[1].toUpperCase(),rest:m[2].trim()};return{unit:p,rest:""};}
function packHTML(p){const b=packBits(p);if(!b.unit)return`<span class="pack-cell">—</span>`;return`<span class="pack"><span class="pk-unit">${esc(b.unit)}</span>${esc(b.rest)}</span>`;}
function toast(msg,kind=""){const t=$("#toast");t.className="toast show "+kind;t.innerHTML=(kind==="ok"?"✓ ":kind==="warn"?"⚠ ":"")+esc(msg);clearTimeout(t._t);t._t=setTimeout(()=>t.className="toast "+kind,2200);}

function dayCons(mk,day,itemId,grpId){
  const m=db.months[mk]; if(!m)return 0;
  return (((m.cons[day]||{})[itemId]||{})[grpId])||0;
}
function setDayCons(mk,day,itemId,grpId,val){
  const m=ensureMonth(mk);
  m.cons[day]=m.cons[day]||{}; m.cons[day][itemId]=m.cons[day][itemId]||{};
  if(val) m.cons[day][itemId][grpId]=val; else { delete m.cons[day][itemId][grpId]; }
}
function dayConsQty(mk,day,itemId){
  let s=0; db.groups.forEach(g=>s+=dayCons(mk,day,itemId,g.id)); return s;
}
function dayRecv(mk,day,itemId){const m=db.months[mk];if(!m)return 0;return (m.received[day]||{})[itemId]||0;}
function setDayRecv(mk,day,itemId,val){const m=ensureMonth(mk);m.received[day]=m.received[day]||{};if(val)m.received[day][itemId]=val;else delete m.received[day][itemId];}
function opening(mk,itemId){const m=db.months[mk];if(!m)return 0;return m.opening[itemId]||0;}
function setOpening(mk,itemId,val){const m=ensureMonth(mk);if(val)m.opening[itemId]=val;else delete m.opening[itemId];}

function recvUpTo(mk,itemId,day){let s=0;const m=db.months[mk];if(!m)return 0;for(let d=1;d<=day;d++)s+=dayRecv(mk,String(d),itemId);return s;}
function consUpTo(mk,itemId,day){let s=0;for(let d=1;d<=day;d++)s+=dayConsQty(mk,String(d),itemId);return s;}
function closingAt(mk,itemId,day){return opening(mk,itemId)+recvUpTo(mk,itemId,day)-consUpTo(mk,itemId,day);}
function weekOf(day){return Math.ceil(Number(day)/7);}
function weekDays(mk,week){const dim=daysInMonth(mk);const a=[];for(let d=(week-1)*7+1;d<=Math.min(week*7,dim);d++)a.push(d);return a;}
function weekLabel(mk,week){const ds=weekDays(mk,week);return ds.length?`Week ${week} (day ${ds[0]}–${ds[ds.length-1]})`:`Week ${week}`;}
function itemWeekQty(mk,week,itemId){let s=0;weekDays(mk,week).forEach(d=>s+=dayConsQty(mk,String(d),itemId));return s;}
function collectAlerts(mk){
  const out=[];const dim=daysInMonth(mk),weeks=Math.ceil(dim/7);
  db.items.forEach(it=>{
    const lim=Number(it.limit)||0; if(lim<=0)return;
    if(it.limitPer==="week"){
      for(let w=1;w<=weeks;w++){const used=itemWeekQty(mk,w,it.id);
        if(used>lim) out.push({it,scope:weekLabel(mk,w),used,limit:lim,over:used-lim});}
    }else{
      for(let d=1;d<=dim;d++){const used=dayConsQty(mk,String(d),it.id);
        if(used>lim) out.push({it,scope:"Day "+d,used,limit:lim,over:used-lim});}
    }
  });
  return out.sort((a,b)=>b.over-a.over);
}
function dayOverLimit(mk,day,itemId){
  const it=item(itemId);const lim=Number(it.limit)||0;if(lim<=0)return false;
  if(it.limitPer==="week")return itemWeekQty(mk,weekOf(day),itemId)>lim;
  return dayConsQty(mk,String(day),itemId)>lim;
}
function updateAlertBadge(){
  const b=$("#alertBadge");if(!b)return;
  const n=collectAlerts(state.month).length;
  b.textContent=n;b.classList.toggle("hide",n===0);
}
function ccMandays(mk,ccId){const m=db.months[mk];if(!m||!m.ccMandays)return 0;return m.ccMandays[ccId]||0;}
function setCcMandays(mk,ccId,val){const m=ensureMonth(mk);m.ccMandays=m.ccMandays||{};if(val)m.ccMandays[ccId]=val;else delete m.ccMandays[ccId];}
function campTotalMandays(mk){let s=0;db.costCenters.forEach(c=>{if(c.camp)s+=ccMandays(mk,c.id);});return s;}
function ccBaseMandays(mk,cc){return cc.base==="campTotal"?campTotalMandays(mk):ccMandays(mk,cc.id);}
function ccBudget(mk,cc){return ccBaseMandays(mk,cc)*(Number(cc.target)||0);}
function totalBudget(mk){let s=0;db.costCenters.forEach(c=>s+=ccBudget(mk,c));return s;}
function monthTotals(mk){
  const m=db.months[mk]||{cons:{},received:{}};
  let consVal=0, recvVal=0, consByGroup={};
  db.groups.forEach(g=>consByGroup[g.id]=0);
  db.items.forEach(it=>{
    Object.keys(m.cons||{}).forEach(day=>{
      const row=(m.cons[day]||{})[it.id]; if(!row)return;
      db.groups.forEach(g=>{const q=row[g.id]||0; if(q){const _p=priceFor(it,dayKey(mk,day));consVal+=q*_p; consByGroup[g.id]+=q*_p;}});
    });
  });
  return {consVal,consByGroup};
}

function catOptions(sel){

  db.categories.forEach(c=>o+=`<option value="${esc(c)}" ${sel===c?"selected":""}>${esc(c)}</option>`);
  return o;

function searchBox(ph){
  return `<div class="searchwrap">
    <span class="si">🔍</span>
    <input id="searchIn" placeholder="${ph||"Search items…"}" value="${esc(state.search)}" autocomplete="off">
    <button class="mic" id="micBtn" title="Search by voice">🎙️</button>
  </div>`;

function wireSearch(redraw){
  const inp=$("#searchIn"); if(inp){
    inp.oninput=()=>{state.search=inp.value;redraw();};
    inp.focus();const v=inp.value;inp.value="";inp.value=v;
  }
  const mic=$("#micBtn"); if(mic) wireMic(mic,inp,redraw);
}
function filtItems(cat){
  const q=state.search.trim().toLowerCase();
  return db.items.filter(it=>{
    if(cat&&cat!=="ALL"&&it.cat!==cat)return false;
    if(!q)return true;
    return (it.desc+" "+it.ref+" "+it.brand).toLowerCase().includes(q);
  });
}
function groupByCat(list){
  const map={}; list.forEach(it=>{(map[it.cat]=map[it.cat]||[]).push(it);});
  return db.categories.filter(c=>map[c]).map(c=>({cat:c,items:map[c]}));
}

/* ============ VOICE ============ */
let recog=null;
function wireMic(btn,input,redraw){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){btn.style.opacity=.4;btn.title="Voice search not supported in this browser";btn.onclick=()=>toast("Voice search needs Chrome or Edge","warn");return;}
  btn.onclick=()=>{
    if(recog){recog.stop();recog=null;btn.classList.remove("live");return;}
    recog=new SR();recog.lang="en-US";recog.interimResults=true;recog.continuous=false;
    btn.classList.add("live");
    recog.onresult=e=>{
      let txt="";for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;
      txt=txt.replace(/[.,]+$/,"");
      input.value=txt;state.search=txt;redraw();
    };
    recog.onend=()=>{btn.classList.remove("live");recog=null;};
    recog.onerror=ev=>{btn.classList.remove("live");recog=null;if(ev.error!=="aborted")toast("Voice: "+ev.error,"warn");};
    recog.start();
  };
}

function drawDaily(){
  const mk=state.month, day=state.day;
  const groups=db.groups;
  const list=filtItems(state.dailyCat);
  $("#dCount").textContent=`${list.length} item${list.length!==1?"s":""}`;
  const groupsByCat=groupByCat(list);
  const colspanBase=5;
  let head=`<thead><tr>
    <th>Item</th><th>Packing</th><th class="t-r">Cost</th>
    <th class="t-c" style="color:var(--blue)">Received</th>`;
  groups.forEach(g=>head+=`<th class="t-r">${esc(g.name)}</th>`);
  head+=`<th class="t-r">Day Total</th></tr></thead>`;
  let body="<tbody>";
  if(!list.length){
    body+=`<tr><td colspan="${colspanBase+groups.length}"><div class="empty"><div class="em-ic">🔍</div>No items match your search.</div></td></tr>`;
  }else{
    groupsByCat.forEach(grp=>{
      body+=`<tr class="cat-row"><td colspan="${colspanBase+groups.length}">${esc(grp.cat)}</td></tr>`;
      grp.items.forEach(it=>{
        const rq=dayRecv(mk,day,it.id);
        const rowQty=dayConsQty(mk,day,it.id);
        const amt=rowQty*priceFor(it,dayKey(mk,day));
        body+=`<tr data-id="${it.id}">
          <td><div class="desc">${esc(it.desc)}</div><span class="ref">${esc(it.ref)}</span>${it.brand?` · <span class="brand">${esc(it.brand)}</span>`:""}</td>
          <td>${packHTML(it.pack)}</td>
          <td class="t-r cost-cell">${money(priceFor(it,dayKey(mk,day)))}</td>
          <td class="t-c"><input class="qty-in recv-in ${rq?"filled":""}" type="number" min="0" step="any" value="${rq||""}" data-recv="${it.id}" placeholder="0"></td>`;
        const over=dayOverLimit(mk,day,it.id);
        groups.forEach(g=>{
          const q=dayCons(mk,day,it.id,g.id);
          body+=`<td class="t-r"><input class="qty-in ${q?"filled":""} ${over?"over":""}" type="number" min="0" step="any" value="${q||""}" data-q="${it.id}|${g.id}" placeholder="0"></td>`;
        });
        body+=`<td class="t-r amt ${amt?"":"zero"} ${over?"over":""}" data-amt="${it.id}">${money(amt)}${over?`<span class="warn-flag" data-wf="${it.id}" title="Over the ${esc(it.limitPer)} limit of ${qfmt(it.limit)}">⚠</span>`:`<span class="warn-flag hide" data-wf="${it.id}">⚠</span>`}</td></tr>`;
      });
    });
  }
  body+="</tbody>";
  $("#dTable").innerHTML=head+body;
  // wire inputs
  $("#dTable").querySelectorAll("[data-q]").forEach(inp=>{
    inp.onchange=()=>{
      const [iid,gid]=inp.dataset.q.split("|");
      const v=Math.max(0,Number(inp.value)||0);
      setDayCons(mk,day,iid,gid,v); inp.classList.toggle("filled",!!v);
      const it=item(iid);const tot=dayConsQty(mk,day,iid)*priceFor(it,dayKey(mk,day));
      const ac=$(`[data-amt="${iid}"]`);
      const over=dayOverLimit(mk,day,iid);
      const wasOver=ac.classList.contains("over");
      ac.firstChild.textContent=money(tot);ac.classList.toggle("zero",!tot);ac.classList.toggle("over",over);
      const wf=ac.querySelector("[data-wf]");
      if(wf){wf.classList.toggle("hide",!over);wf.title=`Over the ${it.limitPer} limit of ${qfmt(it.limit)}`;}
      $("#dTable").querySelectorAll(`[data-q^="${iid}|"]`).forEach(x=>x.classList.toggle("over",over));
      if(over&&!wasOver){const used=it.limitPer==="week"?itemWeekQty(mk,weekOf(day),iid):dayConsQty(mk,String(day),iid);toast(`⚠ ${it.desc}: ${qfmt(used)} exceeds ${it.limitPer} limit ${qfmt(it.limit)}`,"warn");}
      save(); updateReceipt(); updateAlertBadge();
    };
  });
  $("#dTable").querySelectorAll("[data-recv]").forEach(inp=>{
    inp.onchange=()=>{const v=Math.max(0,Number(inp.value)||0);setDayRecv(mk,day,inp.dataset.recv,v);inp.classList.toggle("filled",!!v);save();updateReceipt();};
  });
  updateReceipt();
}
function updateReceipt(){
  const mk=state.month,day=state.day,groups=db.groups;
  let grand=0,recvVal=0,html=`<span class="rt">Day ${day}</span>`;
  groups.forEach(g=>{
    let s=0;db.items.forEach(it=>{const q=dayCons(mk,day,it.id,g.id);if(q)s+=q*priceFor(it,dayKey(mk,day));});
    grand+=s;
    html+=`<div class="grp"><span class="gn">${esc(g.name)}</span><span class="gv">${money(s)}</span></div>`;
  });
  db.items.forEach(it=>{const r=dayRecv(mk,day,it.id);if(r)recvVal+=r*priceFor(it,dayKey(mk,day));});
  html+=`<div class="sep"></div><div class="grp"><span class="gn" style="color:#7fb3e6">Received in</span><span class="gv" style="color:#9cc6ee">${money(recvVal)}</span></div>`;
  html+=`<div class="grand"><span class="gn">Total consumed</span><span class="gv">${cur()} ${money(grand)}</span></div>`;
  $("#receipt").innerHTML=html;
}

function drawStock(){
  const mk=state.month,day=+state.day,low=db.settings.lowStock;
  const list=filtItems(state.stockCat);
  $("#sCount").textContent=`${list.length} items`;
  let head=`<thead><tr><th>Item</th><th class="t-r">Opening</th><th class="t-r" style="color:var(--blue)">Received</th><th class="t-r">Used</th><th class="t-r">Closing</th><th class="t-c">Status</th></tr></thead>`;

  groupByCat(list).forEach(grp=>{
    body+=`<tr class="cat-row"><td colspan="6">${esc(grp.cat)}</td></tr>`;
    grp.items.forEach(it=>{
      const op=opening(mk,it.id),rc=recvUpTo(mk,it.id,day),us=consUpTo(mk,it.id,day),cl=op+rc-us;
      const cls=cl<0?"neg":cl<=low?"low":"ok";
      const pill=cl<0?`<span class="pill neg">Negative</span>`:cl<=low?`<span class="pill low">Low</span>`:`<span class="pill ok">OK</span>`;
      body+=`<tr data-id="${it.id}">

        <td class="t-r num" style="color:var(--blue)">${qfmt(rc)}</td>
        <td class="t-r num">${qfmt(us)}</td>
        <td class="t-r closing ${cls}">${qfmt(cl)}</td>
        <td class="t-c">${pill}</td></tr>`;
    });
  });
  body+="</tbody>";
  $("#sTable").innerHTML=head+body;
  $("#sTable").querySelectorAll("[data-open]").forEach(inp=>{
    inp.onchange=()=>{const v=Number(inp.value)||0;setOpening(mk,inp.dataset.open,v);inp.classList.toggle("filled",!!v);save();drawStock();};
  });
}

function editField(el){
  const tr=el.closest("tr");const it=item(tr.dataset.id);const f=el.dataset.f;
  const cur0=f==="cost"?it.cost:it[f];
  const inp=document.createElement("input");

  inp.value=cur0;inp.className="qty-in";inp.style.width=f==="desc"?"260px":f==="cost"?"90px":f==="pack"?"230px":"130px";
  el.replaceWith(inp);inp.focus();inp.select();
  const commit=()=>{
    let v=inp.value;
    if(f==="cost"){v=Math.max(0,Number(v)||0);it.cost=v;it.prices=it.prices||{};it.prices[state.month]=v;}
    else it[f]=v.trim();
    save();drawItems();
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{if(e.key==="Enter")inp.blur();if(e.key==="Escape"){inp.onblur=null;drawItems();}};
}

function drawReports(){
  const mk=state.month,{consVal,consByGroup}=monthTotals(mk);
  // received value
  let recvVal=0;const m=db.months[mk]||{received:{}};
  db.items.forEach(it=>{Object.keys(m.received||{}).forEach(d=>{const q=(m.received[d]||{})[it.id]||0;if(q)recvVal+=q*priceFor(it,dayKey(mk,d));});});
  // category breakdown + top items
  const catVal={},itemVal={};
  db.items.forEach(it=>{
    let v=0;Object.keys((db.months[mk]||{cons:{}}).cons||{}).forEach(d=>{
      const row=((db.months[mk].cons[d])||{})[it.id];if(!row)return;
      db.groups.forEach(g=>{v+=(row[g.id]||0)*priceFor(it,dayKey(mk,d));});
    });
    if(v){catVal[it.cat]=(catVal[it.cat]||0)+v;itemVal[it.id]=v;}
  });
  const maxG=Math.max(1,...db.groups.map(g=>consByGroup[g.id]||0));
  const cats=Object.entries(catVal).sort((a,b)=>b[1]-a[1]);
  const maxC=Math.max(1,...cats.map(c=>c[1]));
  const tops=Object.entries(itemVal).sort((a,b)=>b[1]-a[1]).slice(0,12);
  // stock alerts
  const dim=daysInMonth(mk);let neg=0,lowc=0;
  db.items.forEach(it=>{const cl=closingAt(mk,it.id,dim);if(cl<0)neg++;else if(cl<=db.settings.lowStock&&(opening(mk,it.id)||recvUpTo(mk,it.id,dim)))lowc++;});

  let html=`<div class="stats">
    <div class="stat"><span class="tag" style="background:var(--accent)"></span><div class="k">Total consumed</div><div class="v">${money(consVal)}<small>${cur()}</small></div></div>
    <div class="stat"><span class="tag" style="background:var(--blue)"></span><div class="k">Goods received</div><div class="v">${money(recvVal)}<small>${cur()}</small></div></div>
    <div class="stat"><span class="tag" style="background:var(--warn)"></span><div class="k">Negative stock</div><div class="v">${neg}<small>items</small></div></div>
    <div class="stat"><span class="tag" style="background:var(--accent-deep)"></span><div class="k">Low stock</div><div class="v">${lowc}<small>items</small></div></div>
  </div>`;

  html+=`<div class="section-h">Consumption by group</div><div class="tablecard" style="padding:18px"><div class="chart">`;
  db.groups.forEach((g,i)=>{
    const v=consByGroup[g.id]||0,col=GROUP_COLORS[i%GROUP_COLORS.length];
    html+=`<div class="bar-row"><span class="bl">${esc(g.name)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(v/maxG*100).toFixed(1)}%;background:${col}"></div></div>
      <span class="bv">${money(v)}</span></div>`;
  });
  html+=`</div></div>`;

  if(cats.length){
    html+=`<div class="section-h">By category</div><div class="tablecard" style="padding:18px"><div class="chart">`;
    cats.forEach(([c,v])=>{
      html+=`<div class="bar-row"><span class="bl" title="${esc(c)}">${esc(c.length>18?c.slice(0,17)+"…":c)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(v/maxC*100).toFixed(1)}%;background:var(--ink)"></div></div>
        <span class="bv">${money(v)}</span></div>`;
    });
    html+=`</div></div>`;
  }

  if(tops.length){
    html+=`<div class="section-h">Top items by cost</div><div class="tablecard"><div class="tablescroll"><table>
      <thead><tr><th>Item</th><th class="t-r">Qty used</th><th class="t-r">Cost (${cur()})</th></tr></thead><tbody>`;
    tops.forEach(([iid,v])=>{const it=item(iid);const qty=consUpTo(mk,iid,dim);
      html+=`<tr><td><div class="desc">${esc(it.desc)}</div><span class="ref">${esc(it.ref)}</span></td><td class="t-r num">${qfmt(qty)}</td><td class="t-r amt">${money(v)}</td></tr>`;});
    html+=`</tbody></table></div></div>`;
  }
  if(!cats.length){html=`<div class="tablecard"><div class="empty"><div class="em-ic">📊</div>No entries yet for ${monthLabel(mk)}.<br>Add some on the Daily Entry screen.</div></div>`;}
  $("#repBody").innerHTML=html;
}

/* ============ MAN-DAYS ============ */
function viewMandays(){
  const dim=daysInMonth(state.month);
  $("#content").innerHTML=`
    <div class="controls">
      <input type="month" class="dt" id="monthPick" value="${state.month}">
      <span class="count">Targets are set in Settings. Enter actual man-days per day.</span>
    </div>
    <div id="mdBody"></div>`;
  $("#monthPick").onchange=e=>{state.month=e.target.value;render();};
  drawMandays();
}
function drawMandays(){
  const mk=state.month,dim=daysInMonth(mk),groups=db.groups,m=ensureMonth(mk);
  // totals
  let totTarget=0,totActual=0;const gActual={},gTarget={};
  groups.forEach(g=>{gActual[g.id]=0;gTarget[g.id]=(db.targets[g.id]||0)*dim;totTarget+=gTarget[g.id];});
  for(let d=1;d<=dim;d++){groups.forEach(g=>{const v=((m.manday[d]||{})[g.id])||0;gActual[g.id]+=v;totActual+=v;});}
  const maxV=Math.max(1,...groups.map(g=>Math.max(gTarget[g.id],gActual[g.id])));

  let html=`<div class="stats">
    <div class="stat"><div class="k">Target man-days</div><div class="v">${qfmt(totTarget)}</div></div>
    <div class="stat"><div class="k">Actual man-days</div><div class="v">${qfmt(totActual)}</div></div>
    <div class="stat"><span class="tag" style="background:${totActual>=totTarget?'var(--good)':'var(--warn)'}"></span><div class="k">Variance</div><div class="v" style="color:${totActual>=totTarget?'var(--good)':'var(--warn)'}">${totActual-totTarget>=0?"+":""}${qfmt(totActual-totTarget)}</div></div>
  </div>`;
  html+=`<div class="section-h">Target vs actual by group</div><div class="tablecard" style="padding:18px"><div class="chart">`;
  groups.forEach((g,i)=>{
    const col=GROUP_COLORS[i%GROUP_COLORS.length];
    html+=`<div style="margin-bottom:14px"><div class="bl" style="margin-bottom:6px;font-weight:700">${esc(g.name)}</div><div class="dbar">
      <div class="seg"><span class="sl">Target</span><div class="track"><div class="fill" style="width:${(gTarget[g.id]/maxV*100).toFixed(1)}%;background:var(--line);outline:1px solid var(--muted-2)"></div></div><span class="sv">${qfmt(gTarget[g.id])}</span></div>
      <div class="seg"><span class="sl">Actual</span><div class="track"><div class="fill" style="width:${(gActual[g.id]/maxV*100).toFixed(1)}%;background:${col}"></div></div><span class="sv">${qfmt(gActual[g.id])}</span></div>
    </div></div>`;
  });
  html+=`</div></div>`;
  // entry table
  html+=`<div class="section-h">Daily entry</div><div class="tablecard"><div class="tablescroll"><table><thead><tr><th>Date</th>`;
  groups.forEach(g=>html+=`<th class="t-r">${esc(g.name)}<br><span style="font-weight:500;color:var(--muted-2)">tgt ${qfmt(db.targets[g.id]||0)}</span></th>`);
  html+=`</tr></thead><tbody>`;
  for(let d=1;d<=dim;d++){
    html+=`<tr><td class="num" style="color:var(--muted)">${mk}-${String(d).padStart(2,"0")}</td>`;
    groups.forEach(g=>{const v=((m.manday[d]||{})[g.id])||0;
      html+=`<td class="t-r"><input class="qty-in" type="number" step="any" value="${v||""}" data-md="${d}|${g.id}" placeholder="0"></td>`;});
    html+=`</tr>`;
  }
  html+=`</tbody></table></div></div>`;
  $("#mdBody").innerHTML=html;
  $("#mdBody").querySelectorAll("[data-md]").forEach(inp=>{
    inp.onchange=()=>{const [d,gid]=inp.dataset.md.split("|");const v=Number(inp.value)||0;
      m.manday[d]=m.manday[d]||{};if(v)m.manday[d][gid]=v;else delete m.manday[d][gid];save();drawMandays();};
  });
}

  $("#monthPick").onchange=e=>{state.month=e.target.value;render();};

function logRows(){
  const mk=state.month,dim=daysInMonth(mk);
  let list=filtItems(state.logCat||"ALL");
  if(!state.logAll){
    list=list.filter(it=>{for(let d=1;d<=dim;d++)if(dayConsQty(mk,String(d),it.id))return true;return false;});
  }
  return list;
}
function dayTotalCons(mk,d){const m=db.months[mk];if(!m)return 0;const row=(m.cons||{})[String(d)];if(!row)return 0;let s=0;Object.keys(row).forEach(iid=>{const g=row[iid]||{};Object.keys(g).forEach(gid=>{s+=Number(g[gid])||0;});});return s;}
function drawLog(){
  const mk=state.month,dim=daysInMonth(mk),list=logRows();
  $("#logCount").textContent=`${list.length} item${list.length!==1?"s":""} · ${monthLabel(mk)}`;
  let head=`<thead><tr><th class="stickL">Item</th>`;
  for(let d=1;d<=dim;d++){const _z=dayTotalCons(mk,d)===0;head+=`<th class="dcell${_z?' dzero':''}">${d}</th>`;}
  head+=`<th class="tcol">Total</th><th class="tcol">Cost (${cur()})</th></tr></thead>`;
  let body="<tbody>";
  if(!list.length){body+=`<tr><td class="stickL" colspan="${dim+3}"><div class="empty"><div class="em-ic">📅</div>No consumption recorded yet for ${monthLabel(mk)}.</div></td></tr>`;}
  groupByCat(list).forEach(grp=>{
    body+=`<tr class="cat-row"><td class="stickL">${esc(grp.cat)}</td>`;
    for(let d=1;d<=dim;d++)body+=`<td></td>`;body+=`<td></td><td></td></tr>`;
    grp.items.forEach(it=>{
      let tot=0;let val=0;let cells="";
      for(let d=1;d<=dim;d++){
        const q=dayConsQty(mk,String(d),it.id);tot+=q;if(q)val+=q*priceFor(it,dayKey(mk,String(d)));
        const over=q&&dayOverLimit(mk,d,it.id);
        cells+=`<td class="dcell ${q?"has":""} ${over?"over":""}">${q?qfmt(q):"·"}</td>`;
      }
      body+=`<tr><td class="stickL"><div class="desc">${esc(it.desc)}</div><span class="ref">${esc(it.ref)}</span> ${packHTML(it.pack)}</td>${cells}<td class="tcol num">${qfmt(tot)}</td><td class="tcol num">${money(val)}</td></tr>`;
    });
  });
  body+="</tbody>";
  $("#logTable").innerHTML=head+body;
}
function exportLogXls(){
  const mk=state.month,dim=daysInMonth(mk),list=logRows();
  if(!list.length){toast("No consumption to export","warn");return;}
  let days="";for(let d=1;d<=dim;d++)days+=`<th>${d}</th>`;
  let rows="";let lastCat="";
  list.forEach(it=>{
    if(it.cat!==lastCat){lastCat=it.cat;rows+=`<tr class="cat"><td colspan="${dim+4}">${esc(it.cat)}</td></tr>`;}
    let tot=0,cells="";
    for(let d=1;d<=dim;d++){const q=dayConsQty(mk,String(d),it.id);tot+=q;cells+=`<td class="R">${q?qfmt(q):""}</td>`;}
    rows+=`<tr><td>${esc(it.ref)}</td><td class="L">${esc(it.desc)}</td><td class="L">${esc(it.pack)}</td>${cells}<td class="R"><b>${qfmt(tot)}</b></td></tr>`;
  });
  const doc=`<html><head><meta charset="utf-8"><style>body{font-family:Arial}table{border-collapse:collapse;font-size:10px}th{background:#1b2230;color:#fff;padding:4px;border:1px solid #999}td{padding:2px 5px;border:1px solid #ccc}.L{text-align:left}.R{text-align:right}.cat td{background:#efece5;font-weight:bold}h3{margin:0 0 2px}</style></head><body><h3>GLOBAL EMIRATES SERVICES CO L.L.C</h3><div>Daily Consumption Log — ${monthLabel(mk)}</div><br><table border="1"><thead><tr><th>Ref</th><th class="L">Description</th><th class="L">Packing</th>${days}<th>Total Qty</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
  download(`GES_consumption_log_${mk}.xls`,"\uFEFF"+doc,"application/vnd.ms-excel");
  toast("Consumption log exported","ok");
}

function priceRows(){
  const mk=state.priceMonth, edits=state.priceEdits;
  let list=filtItems(state.priceCat||"ALL");
  let rows=list.map(it=>{
    const oldP=priceFor(it,mk);
    const has=Object.prototype.hasOwnProperty.call(edits,it.id);
    const newP=has?(Number(edits[it.id])||0):oldP;
    const diff=newP-oldP, qty=monthConsQty(mk,it.id), impact=diff*qty;
    return {it,oldP,newP,diff,qty,impact,changed:has&&Math.abs(diff)>1e-9};
  });
  if(state.priceChangedOnly) rows=rows.filter(r=>r.changed);
  return rows;
}
function drawPrices(){
  const mk=state.priceMonth, rows=priceRows();
  $("#pCount").textContent=`${rows.length} item${rows.length!==1?"s":""}`;
  const mLabel=monthLabel(mk).split(" ")[0];
  let head=`<thead><tr><th>Item</th><th class="t-r">Price now</th><th class="t-r" style="color:var(--blue)">New price</th><th class="t-r">Diff / unit</th><th class="t-r">Used in ${mLabel}</th><th class="t-r">Cost impact</th></tr></thead>`;
  let body="<tbody>";
  if(!rows.length){body+=`<tr><td colspan="6"><div class="empty"><div class="em-ic">🏷️</div>No items match.</div></td></tr>`;}
  const byCat={};rows.forEach(r=>{(byCat[r.it.cat]=byCat[r.it.cat]||[]).push(r);});
  Object.keys(byCat).forEach(cat=>{
    body+=`<tr class="cat-row"><td colspan="6">${esc(cat)}</td></tr>`;
    byCat[cat].forEach(r=>{
      const col=r.diff>1e-9?"#c0392b":r.diff<-1e-9?"#2f8f6b":"var(--muted)";
      const sign=r.diff>1e-9?"+":"";
      body+=`<tr data-id="${r.it.id}" class="${r.changed?"prow-ch":""}">
        <td><div class="desc">${esc(r.it.desc)}</div><span class="ref">${esc(r.it.ref)}</span></td>
        <td class="t-r cost-cell">${money(r.oldP)}</td>
        <td class="t-r"><input class="qty-in ${r.changed?"filled":""}" type="number" min="0" step="any" value="${r.newP}" data-pp="${r.it.id}" style="width:94px;text-align:right"></td>
        <td class="t-r" style="color:${col};font-weight:700">${r.diff?sign+money(r.diff):"—"}</td>
        <td class="t-r num">${r.qty?qfmt(r.qty):"·"}</td>
        <td class="t-r amt" style="color:${col};font-weight:700">${(r.diff&&r.qty)?sign+money(r.impact):"—"}</td></tr>`;
    });
  });
  body+="</tbody>";
  $("#pTable").innerHTML=head+body;
  $("#pTable").querySelectorAll("[data-pp]").forEach(inp=>{
    inp.onchange=()=>{
      const id=inp.dataset.pp, it=item(id), oldP=priceFor(it,mk), v=Math.max(0,Number(inp.value)||0);
      if(Math.abs(v-oldP)<1e-9) delete state.priceEdits[id]; else state.priceEdits[id]=v;
      drawPrices();
    };
  });
  drawPriceBar();
}
function monthConsQtyFrom(mk,itemId,fromDay){var m=db.months[mk];if(!m)return 0;var fd=Number(fromDay)||1;var s=0;Object.keys(m.cons||{}).forEach(function(d){if(Number(d)>=fd)s+=dayConsQty(mk,d,itemId);});return s;}
function priceChangeList(fromDay){
  const mk=state.priceMonth, edits=state.priceEdits, out=[], fd=Number(fromDay)||1;
  db.items.forEach(it=>{
    if(Object.prototype.hasOwnProperty.call(edits,it.id)){
      const oldP=priceFor(it,mk), newP=Number(edits[it.id])||0, diff=newP-oldP;
      if(Math.abs(diff)>1e-9){const qty=monthConsQtyFrom(mk,it.id,fd);out.push({it,oldP,newP,diff,qty,impact:diff*qty});}
    }
  });
  return out;
}
function drawPriceBar(){
  const bar=$("#pBar"); if(!bar)return;
  const ch=priceChangeList();
  const tot=ch.reduce((a,b)=>a+b.impact,0);
  const col=tot>1e-9?"#ffb4a2":tot<-1e-9?"#9be6c4":"#fff";
  const sign=tot>1e-9?"+":"";
  bar.innerHTML=`<span style="opacity:.85">${ch.length} change${ch.length!==1?"s":""} pending</span>
    <span>Total cost impact: <b style="color:${col}">${ch.length?sign+cur()+" "+money(tot):"—"}</b></span>
    <button class="btn primary sm" id="pApply" ${ch.length?"":"disabled"}>Review &amp; approve…</button>`;
  const b=$("#pApply"); if(b&&ch.length) b.onclick=openPriceApprove;
}
function openPriceApprove(){
  const mk=state.priceMonth;
  if(!priceChangeList(1).length){toast("No changes to apply","warn");return;}
  const _dd=String(daysInMonth(mk)).padStart(2,"0"), _def=`${mk}-01`;
  let t=`<h3>Approve price changes</h3><div class="msub">The new price applies <b>from the date you choose</b>. Cost impact = usage <b>on/after</b> that date × price difference. Nothing is saved until you approve.</div>
    <div class="msub" style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">Price change date <input type="date" id="pEffDate" value="${_def}" min="${mk}-01" max="${mk}-${_dd}" class="dt" style="padding:6px 8px"></div>
    <div class="body" style="max-height:50vh;overflow:auto"><table class="mini"><thead><tr><th>Item</th><th class="t-r">Old</th><th class="t-r">New</th><th class="t-r">Diff</th><th class="t-r">Usage on/after</th><th class="t-r">Impact</th></tr></thead><tbody id="pApRows"></tbody><tfoot><tr class="tot"><td colspan="5" class="t-r"><b>Total cost impact</b></td><td class="t-r"><b id="pApTot"></b></td></tr></tfoot></table></div>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="pConfirm">Approve &amp; save</button></div>`;
  showModal(t);
  function renderRows(){
    const v=($("#pEffDate").value||`${mk}-01`), fd=Number(v.slice(8,10))||1;
    const ch=priceChangeList(fd); let tot=0, rows="";
    ch.forEach(r=>{const sign=r.diff>0?"+":"";const col=r.diff>0?"#c0392b":"#2f8f6b";tot+=r.impact;
      rows+=`<tr><td class="L">${esc(r.it.desc)}<br><span class="ref">${esc(r.it.ref)}</span></td><td class="t-r">${money(r.oldP)}</td><td class="t-r">${money(r.newP)}</td><td class="t-r" style="color:${col}">${sign}${money(r.diff)}</td><td class="t-r">${r.qty?qfmt(r.qty):"0"}</td><td class="t-r" style="color:${col}">${r.qty?sign+money(r.impact):"—"}</td></tr>`;});
    $("#pApRows").innerHTML=rows; $("#pApTot").textContent=`${cur()} ${money(tot)}`;
  }
  renderRows();
  $("#pEffDate").onchange=renderRows;
  $("#pConfirm").onclick=applyPricesConfirmed;
}
function applyPricesConfirmed(){
  const mk=state.priceMonth;
  const effDate=($("#pEffDate")&&$("#pEffDate").value)||`${mk}-01`;
  const fd=Number(effDate.slice(8,10))||1;
  const ch=priceChangeList(fd);
  ch.forEach(r=>{r.it.prices=r.it.prices||{}; r.it.prices[effDate]=r.newP;});
  const nm=newestMonth(); db.items.forEach(it=>{it.cost=priceFor(it,nm);});
  db.priceChanges=db.priceChanges||[];
  db.priceChanges.unshift({when:new Date().toISOString(),month:mk,effDate:effDate,
    changes:ch.map(r=>({id:r.it.id,ref:r.it.ref,desc:r.it.desc,old:r.oldP,new:r.newP,qty:r.qty,impact:r.impact}))});
  state.priceEdits={}; save(); closeModal();
  toast(`${ch.length} price${ch.length!==1?"s":""} saved for ${monthLabel(mk)}`,"ok");
  drawPrices(); drawPriceHistory();
}
function drawPriceHistory(){
  const host=$("#pHist"); if(!host)return;
  const h=db.priceChanges||[];
  if(!h.length){host.innerHTML=`<div class="tablecard"><div class="empty" style="padding:22px"><div class="em-ic">🕑</div>No price changes recorded yet.</div></div>`;return;}

function _dayBlob(src,mk,day){const m=(src.months||{})[mk]||{};const o={};["cons","received","manday"].forEach(s=>{if(m[s]&&m[s][day]!=null)o[s]=m[s][day];});return o;}
function _dayCost(src,mk,day){
  const m=(src.months||{})[mk]; if(!m||!m.cons||!m.cons[day])return 0;
  const byId={}; (src.items||[]).forEach(it=>byId[it.id]=it);
  let s=0; const row=m.cons[day]||{};
  Object.keys(row).forEach(iid=>{const it=byId[iid]; if(!it)return; const pr=priceFor(it,dayKey(mk,day)); const gd=row[iid]||{}; Object.keys(gd).forEach(g=>s+=(gd[g]||0)*pr);});
  return s;
}
function openMergePlan(inc){

  const newItems=(inc.items||[]).filter(it=>!curById[it.id] && !curByRef[normRef(it.ref)]);
  const adds=[], clashes=[];

    const im=inc.months[mk]||{}; const days=new Set();

    days.forEach(d=>{
      const incBlob=JSON.stringify(_dayBlob(inc,mk,d)); if(incBlob==="{}")return;
      const curBlob=JSON.stringify(_dayBlob(db,mk,d));
      if(curBlob==="{}") adds.push({mk,d});
      else if(curBlob!==incBlob) clashes.push({mk,d,cur:_dayCost(db,mk,d),inc:_dayCost(inc,mk,d)});

    Object.keys(iit.prices).forEach(k=>{ if(!(cur.prices&&cur.prices[k]!=null)) newPriceKeys++; }); });
  window.__mergeInc=inc; window.__mergeAdds=adds; window.__mergeClashes=clashes; window.__mergeNewItems=newItems;
  let t=`<h3>Merge from backup</h3><div class="msub">Add another person's data into yours. Nothing of yours is deleted unless you pick “Imported” for a clashing day.</div>
    <div class="body" style="max-height:56vh;overflow:auto">
    <p style="font-size:13px;color:var(--muted)">Will add automatically: <b>${adds.length}</b> new day${adds.length!==1?"s":""}, <b>${newItems.length}</b> new item${newItems.length!==1?"s":""}, <b>${newPriceKeys}</b> new price entr${newPriceKeys!==1?"ies":"y"}.</p>`;
  if(clashes.length){
    t+=`<div class="section-h" style="margin-top:6px">Days you both have (${clashes.length}) — choose one for each</div><table class="mini"><thead><tr><th class="L">Day</th><th class="t-r">Yours</th><th class="t-r">Imported</th><th class="t-c">Keep</th></tr></thead><tbody>`;
    clashes.forEach((c,i)=>{
      t+=`<tr><td class="L">${monthLabel(c.mk)} · Day ${c.d}</td><td class="t-r">${cur()} ${money(c.cur)}</td><td class="t-r">${cur()} ${money(c.inc)}</td>
        <td class="t-c" style="white-space:nowrap"><label style="margin-right:8px"><input type="radio" name="clash${i}" value="mine" checked> Mine</label><label><input type="radio" name="clash${i}" value="inc"> Imported</label></td></tr>`;
    });
    t+=`</tbody></table>`;
  } else { t+=`<p style="font-size:13px;color:#2f8f6b">No clashing days — this is a clean merge.</p>`; }
  t+=`</div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="mrgApply">Merge now</button></div>`;
  showModal(t);
  $("#mrgApply").onclick=()=>applyMerge();
}
function applyMerge(){
  const inc=window.__mergeInc, adds=window.__mergeAdds||[], clashes=window.__mergeClashes||[], newItems=window.__mergeNewItems||[];
  if(!inc)return;
  function ensureMonth(mk){ if(!db.months[mk])db.months[mk]={opening:{},received:{},cons:{},manday:{}}; const m=db.months[mk]; ["opening","received","cons","manday"].forEach(s=>{if(!m[s])m[s]={};}); return m; }
  function putDay(mk,d,useInc){
    const im=(inc.months||{})[mk]||{}; const m=ensureMonth(mk);
    ["cons","received","manday"].forEach(s=>{
      if(useInc){ if(im[s]&&im[s][d]!=null){m[s][d]=im[s][d];} else if(m[s][d]!=null){delete m[s][d];} }
      else { if(im[s]&&im[s][d]!=null&&m[s][d]==null){m[s][d]=im[s][d];} }
    });
  }
  newItems.forEach(it=>db.items.push(it));
  const curById={}, curByRef={}; db.items.forEach(it=>{curById[it.id]=it; curByRef[normRef(it.ref)]=it;});
  (inc.items||[]).forEach(iit=>{ const cur=curById[iit.id]||curByRef[normRef(iit.ref)]; if(!cur||!iit.prices)return; cur.prices=cur.prices||{}; Object.keys(iit.prices).forEach(k=>{ if(cur.prices[k]==null)cur.prices[k]=iit.prices[k]; }); });
  adds.forEach(a=>putDay(a.mk,a.d,true));
  let usedInc=0;
  clashes.forEach((c,i)=>{ const sel=document.querySelector(`input[name="clash${i}"]:checked`); if(sel&&sel.value==="inc"){ putDay(c.mk,c.d,true); usedInc++; } });
  (inc.categories||[]).forEach(c=>{ if(!db.categories.includes(c))db.categories.push(c); });
  (inc.groups||[]).forEach(g=>{ if(!(db.groups||[]).some(x=>x.id===g.id))db.groups.push(g); });
  (inc.costCenters||[]).forEach(cc=>{ if(!(db.costCenters||[]).some(x=>x.id===cc.id))db.costCenters.push(cc); });
  const sig=b=>`${b.month}|${b.effDate||""}|${(b.changes||[]).length}|${b.when||""}`;
  const have=new Set((db.priceChanges||[]).map(sig));
  (inc.priceChanges||[]).forEach(b=>{ if(!have.has(sig(b))){ (db.priceChanges=db.priceChanges||[]).push(b); } });
  if(db.priceChanges) db.priceChanges.sort((a,b)=>(b.when||"").localeCompare(a.when||""));
  const nm=newestMonth(); db.items.forEach(it=>{it.cost=priceFor(it,nm);});
  save(); closeModal();
  toast(`Merged: ${adds.length} day(s) added, ${usedInc} clash(es) used imported, ${newItems.length} new item(s)`,"ok");
  window.__mergeInc=null;
  go("daily");
}

/* ============ COST BY CATEGORY (consumption) ============ */
function ccDayByCat(mk,day){
  const cats={},gTot={};let grand=0;
  db.items.forEach(it=>{const price=priceFor(it,dayKey(mk,day));
    db.groups.forEach(g=>{const q=dayCons(mk,day,it.id,g.id);if(q){const amt=q*price;
      const c=cats[it.cat]||(cats[it.cat]={_t:0});c[g.id]=(c[g.id]||0)+amt;c._t+=amt;
      gTot[g.id]=(gTot[g.id]||0)+amt;grand+=amt;}});});
  return {cats,gTot,grand};
}
function ccMonthGrid(mk){
  const dim=daysInMonth(mk);const grid=[];const catTot={};let grand=0;
  for(let d=1;d<=dim;d++){const byCat={};let dt=0;
    db.items.forEach(it=>{const q=dayConsQty(mk,String(d),it.id);if(q){const amt=q*priceFor(it,dayKey(mk,String(d)));
      byCat[it.cat]=(byCat[it.cat]||0)+amt;dt+=amt;catTot[it.cat]=(catTot[it.cat]||0)+amt;}});
    grid.push({day:d,byCat,total:dt});grand+=dt;}
  return {dim,grid,catTot,grand};
}
function ccMonthByCatGroup(mk){
  const dim=daysInMonth(mk);const cats={},gTot={};let grand=0;
  db.items.forEach(it=>{
    db.groups.forEach(g=>{let amt=0;for(let d=1;d<=dim;d++){const q=dayCons(mk,String(d),it.id,g.id);if(q)amt+=q*priceFor(it,dayKey(mk,String(d)));}
      if(amt){const c=cats[it.cat]||(cats[it.cat]={_t:0});c[g.id]=(c[g.id]||0)+amt;c._t+=amt;
        gTot[g.id]=(gTot[g.id]||0)+amt;grand+=amt;}});});
  return {cats,gTot,grand};
}
function viewCostCat(){
  if(state.ccTab!=="month")state.ccTab="day";
  $("#topActions").innerHTML=`<button class="btn sm" id="ccPrint">🖨 Print</button><button class="btn sm" id="ccXls">⬇ Excel</button>`;
  const dim=daysInMonth(state.month);if(+state.day>dim)state.day=String(dim);
  let dayOpts="";for(let d=1;d<=dim;d++)dayOpts+=`<option value="${d}" ${+state.day===d?"selected":""}>Day ${d}</option>`;
  $("#content").innerHTML=`
    <div class="controls">
      <input type="month" class="dt" id="monthPick" value="${state.month}">
      <select class="sel" id="dayPick">${dayOpts}</select>
      <button class="btn sm ${state.ccTab==="day"?"":"ghost"}" id="ccTabDay">Selected day</button>
      <button class="btn sm ${state.ccTab==="month"?"":"ghost"}" id="ccTabMonth">Whole month</button>
    </div>
    <div id="ccBody"></div>`;
  $("#monthPick").onchange=e=>{state.month=e.target.value;render();};
  $("#dayPick").onchange=e=>{state.day=e.target.value;drawCostCat();};
  $("#ccTabDay").onclick=()=>{state.ccTab="day";render();};
  $("#ccTabMonth").onclick=()=>{state.ccTab="month";render();};
  $("#ccPrint").onclick=()=>outputCostCat("print");
  $("#ccXls").onclick=()=>outputCostCat("excel");
  drawCostCat();
}
function drawCostCat(){
  const mk=state.month,day=state.day,box=$("#ccBody");if(!box)return;
  if(state.ccTab==="day"){
    const {cats,gTot,grand}=ccDayByCat(mk,day);
    let h=`<div class="section-h">Cost by Category — Day ${day}, ${monthLabel(mk)} <span style="color:var(--muted);font-weight:400">(what was used · ${cur()})</span></div>`;
    h+=`<div class="tablecard"><div class="tablescroll"><table><thead><tr><th style="text-align:left">Category</th>`;
    db.groups.forEach(g=>h+=`<th style="text-align:right">${esc(g.name)}</th>`);
    h+=`<th style="text-align:right">Total</th></tr></thead><tbody>`;
    db.categories.forEach(c=>{const row=cats[c],t=row?row._t:0;
      h+=`<tr><td>${esc(c)}</td>`;
      db.groups.forEach(g=>{const v=(row&&row[g.id])||0;h+=`<td style="text-align:right">${v?money(v):"–"}</td>`;});
      h+=`<td style="text-align:right"><b>${t?money(t):"–"}</b></td></tr>`;});
    h+=`<tr class="tot"><td><b>TOTAL</b></td>`;
    db.groups.forEach(g=>h+=`<td style="text-align:right"><b>${gTot[g.id]?money(gTot[g.id]):"–"}</b></td>`);
    h+=`<td style="text-align:right"><b>${money(grand)}</b></td></tr></tbody></table></div></div>`;
    box.innerHTML=h;
  }else{
    const g=ccMonthGrid(mk),cats=db.categories;
    let h=`<div class="section-h">Daily Spend by Category — ${monthLabel(mk)} <span style="color:var(--muted);font-weight:400">(what was used · ${cur()})</span></div>`;
    h+=`<div class="tablecard"><div class="tablescroll"><table><thead><tr><th style="text-align:left">Day</th>`;
    cats.forEach(c=>h+=`<th style="text-align:right">${esc(c)}</th>`);
    h+=`<th style="text-align:right">Day Total</th></tr></thead><tbody>`;
    g.grid.forEach(r=>{h+=`<tr><td>${r.day}</td>`;
      cats.forEach(c=>{const v=r.byCat[c]||0;h+=`<td style="text-align:right">${v?money(v):""}</td>`;});
      h+=`<td style="text-align:right"><b>${r.total?money(r.total):""}</b></td></tr>`;});
    h+=`<tr class="tot"><td><b>TOTAL</b></td>`;
    cats.forEach(c=>h+=`<td style="text-align:right"><b>${g.catTot[c]?money(g.catTot[c]):"–"}</b></td>`);
    h+=`<td style="text-align:right"><b>${money(g.grand)}</b></td></tr></tbody></table></div></div>`;
    const gs=ccMonthByCatGroup(mk);
    h+=`<div class="section-h" style="margin-top:18px">Month totals by group</div>`;
    h+=`<div class="tablecard"><div class="tablescroll"><table><thead><tr><th style="text-align:left">Category</th>`;
    db.groups.forEach(gr=>h+=`<th style="text-align:right">${esc(gr.name)}</th>`);
    h+=`<th style="text-align:right">Total</th></tr></thead><tbody>`;
    db.categories.forEach(c=>{const row=gs.cats[c],t=row?row._t:0;
      h+=`<tr><td>${esc(c)}</td>`;
      db.groups.forEach(gr=>{const v=(row&&row[gr.id])||0;h+=`<td style="text-align:right">${v?money(v):"–"}</td>`;});
      h+=`<td style="text-align:right"><b>${t?money(t):"–"}</b></td></tr>`;});
    h+=`<tr class="tot"><td><b>TOTAL</b></td>`;
    db.groups.forEach(gr=>h+=`<td style="text-align:right"><b>${gs.gTot[gr.id]?money(gs.gTot[gr.id]):"–"}</b></td>`);
    h+=`<td style="text-align:right"><b>${money(gs.grand)}</b></td></tr></tbody></table></div></div>`;
    box.innerHTML=h;
  }
}
function ccDocStyle(){return `<style>
  body{font-family:Arial,Helvetica,sans-serif;color:#1b2230;margin:24px}
  .co{font-size:18px;font-weight:bold;letter-spacing:.5px}
  .sub{font-size:13px;color:#555;margin:2px 0}
  .date{font-size:14px;font-weight:bold;margin:10px 0 14px;color:#b86a1c}
  table{border-collapse:collapse;width:100%;font-size:11px;margin-bottom:8px}
  th{background:#1b2230;color:#fff;text-align:center;font-size:10px;padding:5px}
  td{padding:3px 6px;border:1px solid #ccc}
  .L{text-align:left}.R{text-align:right}.C{text-align:center}
  .tot td{background:#fdf1e3;font-weight:bold}
  h4{margin:18px 0 4px}
  @media print{@page{size:landscape;margin:10mm}body{margin:0}}
</style>`;}
function buildCostCatDoc(){
  const mk=state.month,day=state.day,style=ccDocStyle();let title,body;
  if(state.ccTab==="day"){
    const {cats,gTot,grand}=ccDayByCat(mk,day);
    title=`Cost by Category — Day ${day}, ${monthLabel(mk)}`;
    let t=`<table border="1" cellspacing="0" cellpadding="4"><thead><tr><th class="L">Category</th>`;
    db.groups.forEach(g=>t+=`<th class="R">${esc(g.name)} (${cur()})</th>`);
    t+=`<th class="R">Total (${cur()})</th></tr></thead><tbody>`;
    db.categories.forEach(c=>{const row=cats[c],tt=row?row._t:0;
      t+=`<tr><td class="L">${esc(c)}</td>`;
      db.groups.forEach(g=>{const v=(row&&row[g.id])||0;t+=`<td class="R">${v?money(v):""}</td>`;});
      t+=`<td class="R"><b>${tt?money(tt):""}</b></td></tr>`;});
    t+=`<tr class="tot"><td class="L">TOTAL</td>`;
    db.groups.forEach(g=>t+=`<td class="R">${money(gTot[g.id]||0)}</td>`);
    t+=`<td class="R">${money(grand)}</td></tr></tbody></table>`;
    body=t;
  }else{
    const g=ccMonthGrid(mk),cats=db.categories;
    title=`Daily Spend by Category — ${monthLabel(mk)}`;
    let t=`<table border="1" cellspacing="0" cellpadding="4"><thead><tr><th class="C">Day</th>`;
    cats.forEach(c=>t+=`<th class="R">${esc(c)}</th>`);
    t+=`<th class="R">Day Total</th></tr></thead><tbody>`;
    g.grid.forEach(r=>{t+=`<tr><td class="C">${r.day}</td>`;
      cats.forEach(c=>{const v=r.byCat[c]||0;t+=`<td class="R">${v?money(v):""}</td>`;});
      t+=`<td class="R"><b>${r.total?money(r.total):""}</b></td></tr>`;});
    t+=`<tr class="tot"><td class="C">TOTAL</td>`;
    cats.forEach(c=>t+=`<td class="R">${money(g.catTot[c]||0)}</td>`);
    t+=`<td class="R">${money(g.grand)}</td></tr></tbody></table>`;
    const gs=ccMonthByCatGroup(mk);
    let s=`<h4>Month totals by group</h4><table border="1" cellspacing="0" cellpadding="4"><thead><tr><th class="L">Category</th>`;
    db.groups.forEach(gr=>s+=`<th class="R">${esc(gr.name)} (${cur()})</th>`);
    s+=`<th class="R">Total (${cur()})</th></tr></thead><tbody>`;
    db.categories.forEach(c=>{const row=gs.cats[c],tt=row?row._t:0;
      s+=`<tr><td class="L">${esc(c)}</td>`;
      db.groups.forEach(gr=>{const v=(row&&row[gr.id])||0;s+=`<td class="R">${v?money(v):""}</td>`;});
      s+=`<td class="R"><b>${tt?money(tt):""}</b></td></tr>`;});
    s+=`<tr class="tot"><td class="L">TOTAL</td>`;
    db.groups.forEach(gr=>s+=`<td class="R">${money(gs.gTot[gr.id]||0)}</td>`);
    s+=`<td class="R">${money(gs.grand)}</td></tr></tbody></table>`;
    body=t+s;
  }
  return `<html><head><meta charset="utf-8"><title>${title}</title>${style}</head><body><div class="co">GLOBAL EMIRATES SERVICES CO L.L.C</div><div class="sub">Cost by Category — Consumption</div><div class="date">${title}</div>${body}<div class="sub" style="margin-top:16px">Generated ${new Date().toLocaleString("en")}</div></body></html>`;
}
function outputCostCat(mode){
  const has = state.ccTab==="day" ? ccDayByCat(state.month,state.day).grand>0 : ccMonthGrid(state.month).grand>0;
  if(!has){toast("No consumption to report yet","warn");return;}
  const doc=buildCostCatDoc();
  if(mode==="excel"){
    const tag = state.ccTab==="day" ? `day_${state.month}-${String(state.day).padStart(2,"0")}` : `month_${state.month}`;
    download(`GES_cost_by_category_${tag}.xls`,"\uFEFF"+doc,"application/vnd.ms-excel");
    toast("Excel file downloaded","ok");
  }else{
    const w=window.open("","_blank");if(!w){toast("Allow pop-ups to print","warn");return;}
    w.document.write(doc);w.document.close();w.focus();setTimeout(()=>{try{w.print();}catch(e){}},350);
  }
}
